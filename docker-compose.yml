services:
  digitral:
    build: .
    image: digitral-dashboard:latest
    container_name: digitral-dashboard
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      FRONTEND_HOME: /app/data
      POLL_SEC: "60"
      # DEVICE_PROFILE: /app/profile.json   # optional: mount a real device profile
    volumes:
      - digitral_data:/app/data
      # - ./profile.json:/app/profile.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  digitral_data:
    name: digitral_data