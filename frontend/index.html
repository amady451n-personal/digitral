<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digitral">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/bima.png">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<title>Digitral multi-number dashboard</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --danger:#f87171; --ok:#4ade80; --warn:#fbbf24; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  body { padding-bottom: env(safe-area-inset-bottom); }
  header { padding:14px 16px; background:#0b1220; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; padding-top:calc(14px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:17px; }
  #status { font-size:12px; color:var(--muted); }
  #status.offline { color:var(--danger); }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .toolbar { margin-bottom:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); } }
  .card { border-radius:14px; padding:14px; position:relative; overflow:hidden; min-height:120px; background:var(--card); border:1px solid #334155; }
  .card::before { content:""; position:absolute; right:-10px; bottom:-10px; width:96px; height:96px; background-size:contain; background-repeat:no-repeat; background-position:right bottom; opacity:0.18; pointer-events:none; }
  .card.provider-bima::before { background-image:url(/assets/bima.png); }
  .card.provider-myim3::before { background-image:url(/assets/myim3.png); }
  .card.pending { border-style:dashed; border-color:var(--warn); }
  .card h3 { margin:0 0 2px; font-size:16px; display:flex; align-items:center; gap:8px; }
  .card .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#334155; color:var(--muted); }
  .card .badge.pending { background:#78350f; color:#fde68a; }
  .card .msisdn { color:var(--muted); font-size:13px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; font-size:14px; margin:3px 0; }
  .row .k { color:var(--muted); }
  .err { color:var(--danger); font-size:13px; margin-top:8px; }
  .ok { color:var(--ok); }
  button { background:var(--accent); color:#0b1220; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:600; font-size:14px; min-height:40px; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  button.danger { background:var(--danger); color:#fff; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid #334155; }
  button.small { padding:6px 10px; font-size:13px; min-height:32px; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  @media (min-width:640px) { .modal-back { align-items:center; } }
  .modal-back.show { display:flex; }
  .modal { background:var(--card); border-radius:16px 16px 0 0; padding:20px; width:100%; max-width:420px; max-height:90vh; overflow:auto; }
  @media (min-width:640px) { .modal { border-radius:16px; } }
  .modal h2 { margin:0 0 12px; font-size:17px; }
  .modal input, .modal select { width:100%; padding:10px; margin:6px 0 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--fg); font-size:16px; }
  .status { font-size:12px; color:var(--muted); margin-top:8px; }
  .pending-box { margin-top:10px; padding:10px; background:#0f172a; border-radius:8px; }
  .pending-box input { margin:6px 0; }
  .actions { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .install-btn { display:none; }
  .install-btn.show { display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>Digitral</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="installBtn" class="ghost small install-btn">Install</button>
    <span id="status" class="status">connecting…</span>
  </div>
</header>
<main>
  <div class="toolbar">
    <button id="addBtn">+ Tambah nomor</button>
    <button id="refreshBtn" class="ghost">Refresh</button>
  </div>
  <div id="grid" class="grid"></div>
</main>

<div id="modal" class="modal-back">
  <div class="modal">
    <h2>Tambah nomor</h2>
    <label>Provider</label>
    <select id="prov"></select>
    <label>Nomor (62…)</label>
    <input id="msisdn" type="tel" inputmode="numeric" placeholder="628xxxxxxxxxx">
    <button id="sendOtp">Kirim OTP</button>
    <div id="otpStep" style="display:none">
      <label>Kode OTP</label>
      <input id="otp" inputmode="numeric" placeholder="123456">
      <button id="verifyOtp">Verifikasi</button>
    </div>
    <div id="modalMsg" class="status"></div>
    <button id="cancelBtn" class="ghost" style="margin-top:8px">Batal</button>
  </div>
</div>

<script>
const API = "";
let pendingId = null;

async function api(path, opts={}) {
  const r = await fetch(API + path, {headers:{"Content-Type":"application/json"}, ...opts});
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch { j = {raw:t}; }
  if (!r.ok) throw new Error(j.detail || j.error || j.message || r.statusText);
  return j;
}

async function withBusy(btn, fn) {
  if (btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  try { await fn(); }
  finally { btn.disabled = false; btn.textContent = orig; }
}

function fmtQuota(d) {
  if (!d) return "-";
  const r = d.summary?.data?.remainingquota;
  const u = (d.summary?.data?.quotaunit || "KB").toUpperCase();
  if (r == null) return "-";
  const kb = Number(r);
  if (u === "KB") {
    if (kb >= 1024*1024) return (kb/1024/1024).toFixed(2)+" GB";
    if (kb >= 1024) return (kb/1024).toFixed(1)+" MB";
    return kb+" KB";
  }
  return r+" "+u;
}

function renderNumber(n) {
  const d = n.data || {};
  const pulsa = d.prepaidinfo?.balance ?? "-";
  const aktif = d.prepaidinfo?.cardactiveuntil ?? "-";
  const grace = d.prepaidinfo?.graceperioduntil;
  const bonstri = d.bonstriDetails?.totalPoints;
  const cls = "card provider-" + (n.provider || "");
  if (n.pending) {
    return `
    <div class="${cls} pending">
      <h3>${n.label || n.provider} <span class="badge pending">menunggu OTP</span></h3>
      <div class="msisdn">${n.msisdn}</div>
      <div class="pending-box">
        <input id="otp-${n.id}" inputmode="numeric" placeholder="Kode OTP">
        <div class="actions">
          <button class="small" onclick="verifyPending('${n.id}')">Verifikasi</button>
          <button class="small ghost" onclick="resendPending('${n.id}', this)">Kirim ulang</button>
          <button class="small danger" onclick="removeNum('${n.id}')">Batal</button>
        </div>
        <div id="msg-${n.id}" class="status"></div>
      </div>
    </div>`;
  }
  return `
    <div class="${cls}">
      <h3>${n.label || n.provider} <span class="badge">${n.provider}</span></h3>
      <div class="msisdn">${n.msisdn}</div>
      ${n.ok ? `
        <div class="row"><span class="k">Pulsa</span><span>Rp ${pulsa}</span></div>
        <div class="row"><span class="k">Kuota sisa</span><span>${fmtQuota(d)}</span></div>
        <div class="row"><span class="k">Masa aktif</span><span>${aktif}</span></div>
        ${grace ? `<div class="row"><span class="k">Grace s/d</span><span>${grace}</span></div>` : ""}
        ${bonstri != null ? `<div class="row"><span class="k">Bonstri</span><span>${bonstri} pts</span></div>` : ""}
      ` : `<div class="err">${n.error || "no data"}</div>`}
      <div class="actions">
        <button class="ghost small" onclick="refreshOne('${n.id}', this)">Refresh</button>
        <button class="danger small" onclick="removeNum('${n.id}', this)">Hapus</button>
      </div>
    </div>`;
}

async function loadNumbers() {
  const j = await api("/numbers?include_pending=1");
  const grid = document.getElementById("grid");
  const enriched = await Promise.all(j.numbers.map(async n => {
    if (n.pending) return {...n, ok:false};
    try { const b = await api(`/numbers/${n.id}/balance`); return {...n, ok:true, data:b.balance}; }
    catch (e) { return {...n, ok:false, error:e.message}; }
  }));
  grid.innerHTML = enriched.map(renderNumber).join("") || "<p class='status'>Belum ada nomor. Tambah dengan tombol +.</p>";
  try { localStorage.setItem("digitral:lastSnapshot", JSON.stringify(enriched)); } catch {}
}

async function refreshOne(id, btn) {
  await withBusy(btn, async () => { await loadNumbers(); });
}

async function removeNum(id, btn) {
  if (!confirm("Hapus nomor ini dari dashboard?")) return;
  const run = async () => { await api(`/numbers/${id}`, {method:"DELETE"}); await loadNumbers(); };
  if (btn) await withBusy(btn, run); else await run();
}

async function verifyPending(id) {
  const otp = document.getElementById(`otp-${id}`).value.trim();
  const msg = document.getElementById(`msg-${id}`);
  const btn = event.target;
  await withBusy(btn, async () => {
    try {
      await api(`/numbers/${id}/verify`, {method:"POST", body:JSON.stringify({otp})});
      msg.textContent = "Terverifikasi ✓";
      await loadNumbers();
    } catch (e) { msg.textContent = "Gagal: "+e.message; throw e; }
  });
}

async function resendPending(id, btn) {
  await withBusy(btn, async () => {
    try {
      const r = await api(`/numbers/${id}/resend`, {method:"POST"});
      document.getElementById(`msg-${id}`).textContent = "OTP terkirim ulang.";
    } catch (e) { document.getElementById(`msg-${id}`).textContent = "Gagal: "+e.message; throw e; }
  });
}

const modal = document.getElementById("modal");
document.getElementById("addBtn").onclick = async () => {
  const provs = await api("/providers");
  const sel = document.getElementById("prov");
  sel.innerHTML = provs.filter(p=>p.available).map(p=>`<option value="${p.id}">${p.label}</option>`).join("");
  document.getElementById("msisdn").value = "";
  document.getElementById("otp").value = "";
  document.getElementById("otpStep").style.display = "none";
  document.getElementById("modalMsg").textContent = "";
  pendingId = null;
  modal.classList.add("show");
};

document.getElementById("prov").addEventListener("change", () => {
  if (pendingId) { api(`/numbers/${pendingId}`, {method:"DELETE"}).catch(()=>{}); pendingId = null; }
  document.getElementById("msisdn").value = "";
  document.getElementById("otp").value = "";
  document.getElementById("otpStep").style.display = "none";
  document.getElementById("modalMsg").textContent = "";
});

document.getElementById("sendOtp").onclick = async (e) => {
  const btn = e.target;
  await withBusy(btn, async () => {
    const msisdn = document.getElementById("msisdn").value.trim();
    const provider = document.getElementById("prov").value;
    const msg = document.getElementById("modalMsg");
    try {
      const r = await api("/numbers", {method:"POST", body:JSON.stringify({provider, msisdn})});
      pendingId = r.id;
      if (r.otp_required === false) {
        msg.textContent = "Sesi sudah ada — tanpa OTP ✓";
        modal.classList.remove("show");
        await loadNumbers();
      } else {
        msg.textContent = "OTP terkirim. Masukkan kode.";
        document.getElementById("otpStep").style.display = "block";
      }
    } catch (err) { msg.textContent = "Gagal: "+err.message; throw err; }
  });
};

document.getElementById("verifyOtp").onclick = async (e) => {
  const btn = e.target;
  await withBusy(btn, async () => {
    const otp = document.getElementById("otp").value.trim();
    const msg = document.getElementById("modalMsg");
    try {
      await api(`/numbers/${pendingId}/verify`, {method:"POST", body:JSON.stringify({otp})});
      msg.textContent = "Terverifikasi ✓";
      pendingId = null;
      modal.classList.remove("show");
      await loadNumbers();
    } catch (err) { msg.textContent = "Gagal: "+err.message; throw err; }
  });
};

document.getElementById("cancelBtn").onclick = async () => {
  if (pendingId) { try { await api(`/numbers/${pendingId}`, {method:"DELETE"}); } catch {} pendingId = null; }
  modal.classList.remove("show");
};

document.getElementById("refreshBtn").onclick = async (e) => {
  await withBusy(e.target, async () => { await loadNumbers(); });
};

// offline snapshot restore
function restoreSnapshot() {
  try {
    const raw = localStorage.getItem("digitral:lastSnapshot");
    if (!raw) return;
    const data = JSON.parse(raw);
    const grid = document.getElementById("grid");
    if (grid.children.length === 0) grid.innerHTML = data.map(renderNumber).join("");
  } catch {}
}
restoreSnapshot();

// status
const statusEl = document.getElementById("status");
function setOnline() {
  statusEl.textContent = navigator.onLine ? "live" : "offline";
  statusEl.classList.toggle("offline", !navigator.onLine);
}
window.addEventListener("online", () => { setOnline(); loadNumbers(); });
window.addEventListener("offline", setOnline);
setOnline();

// SSE
function connectStream() {
  const es = new EventSource("/stream");
  es.onmessage = e => {
    try {
      const p = JSON.parse(e.data);
      if (p.numbers) {
        const grid = document.getElementById("grid");
        grid.innerHTML = p.numbers.map(renderNumber).join("") || "<p class='status'>Belum ada nomor. Tambah dengan tombol +.</p>";
        try { localStorage.setItem("digitral:lastSnapshot", JSON.stringify(p.numbers)); } catch {}
        setOnline();
      }
    } catch {}
  };
  es.onerror = () => { statusEl.textContent = "stream terputus, retry…"; statusEl.classList.add("offline"); };
  es.onopen = () => setOnline();
}
connectStream();
loadNumbers();

// install prompt
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").classList.add("show");
});
document.getElementById("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBtn").classList.remove("show");
};
</script>
</body>
</html>
